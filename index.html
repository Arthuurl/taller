<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="marcas.js"></script>
<style>
:root{--bg:#E6EAEE;--tinta:#1B2733;--panel:#fff;--linea:#CBD3DB;--suave:#5B6875;--amar:#F2B705;--verde:#2E8B57;--rojo:#C8423B;--azul:#2F5D8A}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--tinta);background:var(--bg)}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;line-height:1.1;margin:0 0 .4em}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.2rem}
p{margin:.3em 0}
.suave{color:var(--suave);font-size:.92rem}
header#top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:5}
header#top::after{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,var(--amar) 0 12px,var(--tinta) 12px 24px)}
.barra{display:flex;align-items:center;gap:6px 10px;padding:10px 16px;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:1.4rem;font-weight:700;margin-right:auto;line-height:1.1}
.logo small{display:block;font:400 .8rem Barlow,system-ui,sans-serif;color:#AEB9C4}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{height:38px;width:auto;max-width:130px;object-fit:contain;background:#fff;border-radius:4px;padding:3px}
.logo-prev{min-height:120px;display:flex;align-items:center;justify-content:center;background:#F4F6F8;border:1px dashed var(--linea);border-radius:6px;padding:12px}
.logo-prev img{max-height:140px;max-width:100%;object-fit:contain}
.fotos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.fotos.subiendo{opacity:.5;pointer-events:none}
.mini{position:relative;display:inline-block;line-height:0}
.mini img{width:62px;height:62px;object-fit:cover;border-radius:4px;border:1px solid var(--linea);background:#EDF1F4;cursor:zoom-in}
.mini.elegible{cursor:pointer;opacity:.55}
.mini.elegible.elegida{opacity:1}
.mini.elegible i{position:absolute;inset:auto 2px 2px auto;width:22px;height:22px;border-radius:50%;
  background:#fff;border:1px solid var(--linea);color:transparent;font:700 13px/22px Barlow,system-ui,sans-serif;text-align:center}
.mini.elegible.elegida i{background:var(--verde);border-color:var(--verde);color:#fff}
.mini.elegible.elegida img{border-color:var(--verde);border-width:2px}
.fotos.grandes .mini img{width:190px;height:150px}
.mini .quitar{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;
  background:var(--rojo);color:#fff;font:700 14px/1 Barlow,system-ui,sans-serif;cursor:pointer}
.ficha{margin-bottom:16px;border-left:5px solid var(--amar)}
.rejilla{margin-top:12px;overflow-x:auto}
.rej-cab,.rej-fila{display:grid;grid-template-columns:120px minmax(520px,1fr);gap:10px;align-items:center}
.rej-fila{margin-top:8px}
.horas{display:flex;justify-content:space-between;font-size:.78rem;color:var(--suave)}
.rej-nombre{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pista{position:relative;height:54px;background:#F1F4F7;border:1px solid var(--linea);border-radius:5px;
  touch-action:none;cursor:crosshair;overflow:hidden}
.pista>i{position:absolute;top:0;bottom:0;width:1px;background:var(--linea)}
.turno{position:absolute;top:4px;bottom:4px;background:var(--tinta);color:#fff;border-radius:4px;padding:4px 7px;
  font-size:.8rem;line-height:1.25;overflow:hidden;cursor:pointer;border-left:4px solid var(--amar)}
.turno span{display:block;color:#C9D2DB;font-size:.75rem;overflow:hidden;text-overflow:ellipsis}
.turno.fantasma{background:var(--azul);opacity:.75;pointer-events:none}
.chip{padding:6px 10px;min-height:36px}
.chip .suave{margin-left:6px}
.turno-fila+.turno-fila{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea)}
.foto-btn{padding:5px 12px;min-height:34px;font-size:.88rem;display:inline-flex;align-items:center;margin:0}
.informe h1{font-size:1.9rem;margin:14px 0 2px}
.informe h2{font-size:1.25rem;margin:22px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--tinta)}
.inf-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  border-bottom:4px solid var(--amar);padding-bottom:10px}
.inf-logo{max-height:70px;max-width:220px;object-fit:contain}
.inf-coche{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  margin:14px 0;padding:12px 14px;background:#F4F6F8;border:1px solid var(--linea);border-radius:6px}
.firmas{display:flex;gap:24px;margin-top:34px;flex-wrap:wrap}
.firmas div{flex:1 1 180px;font-size:.9rem;color:var(--suave)}
.firmas span{display:block;border-bottom:1px solid var(--tinta);height:42px}
@media print{
  header#top,#avisos,#toast,.no-print,nav{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0}
  .informe h2{page-break-after:avoid}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
  .mini img{width:52px;height:52px}
  @page{margin:14mm}
}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav button{background:none;border:0;color:#C9D2DB;font:500 .95rem Barlow,system-ui,sans-serif;padding:8px 10px;border-radius:4px;cursor:pointer}
nav button:hover{color:#fff}
nav button[aria-current=page]{color:#fff;box-shadow:inset 0 -3px var(--amar)}
main{max-width:1100px;margin:auto;padding:22px 16px 70px}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:16px}
.btn{font:600 .95rem Barlow,system-ui,sans-serif;border-radius:4px;padding:8px 14px;border:1px solid transparent;cursor:pointer;min-height:42px}
.pri{background:var(--amar);color:var(--tinta)}
.sec{background:#fff;border-color:var(--linea);color:var(--tinta)}
.ok{background:var(--verde);color:#fff}
.peligro{background:#fff;border-color:var(--rojo);color:var(--rojo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--azul);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--suave)}
label>input,label>select,label>textarea{margin-top:3px}
input,select,textarea{width:100%;font:inherit;font-size:1rem;padding:8px 10px;border:1px solid var(--linea);border-radius:4px;background:#fff;color:var(--tinta)}
input[type=color]{padding:2px;height:42px}
input[type=checkbox]{width:auto}
fieldset{border:1px solid var(--linea);border-radius:4px;margin:10px 0;padding:8px 10px}
legend{font-size:.85rem;color:var(--suave);padding:0 4px}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;color:var(--tinta);font-size:.95rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin:10px 0}
.dos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}
.lista{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pila>*+*{margin-top:12px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.entre{justify-content:space-between}
.cab{justify-content:space-between;margin-bottom:14px}
.cab h1{margin:0}
@media (max-width:760px){.dos{grid-template-columns:1fr}h1{font-size:1.7rem}.tareas-primero>section:last-child{order:-1}}
.placa{display:inline-flex;border:2px solid var(--tinta);border-radius:4px;background:#fff;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.placa::before{content:"E";background:#1D4FA3;color:#fff;font:600 .7rem Barlow,system-ui,sans-serif;padding:10px 4px 0}
.placa span{padding:0 9px}
.escena{background:linear-gradient(#F5F7F9 70%,#D9E0E6);border-radius:4px;padding:6px 10px 0}
.coche-svg{width:100%;height:auto;display:block}
.rueda{transform-box:fill-box;transform-origin:center}
.gira .rueda{animation:girar 1.1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.tarjeta{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.tarjeta:hover{border-color:var(--tinta)}
.estado{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.e-pendiente{color:var(--suave)}.e-en_curso{color:var(--azul)}.e-a_medias{color:#A06A00}
.e-finalizada{color:var(--verde)}.e-abierta{color:var(--azul)}.e-cancelada{color:var(--rojo)}
.barra-prog{height:6px;background:#DDE3E9;border-radius:3px;overflow:hidden;margin:8px 0 4px}
.barra-prog i{display:block;height:100%;background:var(--verde)}
.tarea{border:1px solid var(--linea);border-radius:6px;padding:16px 14px 14px;background:#fff;position:relative}
.tarea.run{border-color:var(--tinta)}
.tarea.run::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:5px 5px 0 0;background:repeating-linear-gradient(-45deg,var(--amar) 0 10px,var(--tinta) 10px 20px);background-size:28.28px 28.28px;animation:mover 1s linear infinite}
@keyframes mover{to{background-position:28.28px 0}}
.cd{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1;margin-top:4px}
.cd.neg{color:var(--rojo)}
.cd.oculto{color:var(--linea);letter-spacing:.05em}
.cd.hecho{color:var(--verde)}
.reps{margin-top:12px}
.rep{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--linea)}
.rep.hecha strong{text-decoration:line-through;color:var(--suave)}
.chk-rep{display:flex;gap:10px;align-items:flex-start;color:var(--tinta);font-size:1rem;margin:0;flex:1 1 220px;cursor:pointer}
.chk-rep input{width:24px;height:24px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--verde)}
.chk-rep input:disabled{cursor:not-allowed}
label.combo{position:relative}
.combo-lista{position:absolute;left:0;right:0;top:100%;z-index:12;margin:2px 0 0;padding:0;list-style:none;
  background:#fff;border:1px solid var(--linea);border-radius:4px;max-height:230px;overflow-y:auto;
  box-shadow:0 8px 20px rgba(27,39,51,.18)}
.combo-lista li{padding:9px 10px;cursor:pointer;font-size:.98rem}
.combo-lista li:hover,.combo-lista li.sel{background:var(--tinta);color:#fff}
#avisos{position:fixed;top:78px;right:12px;width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:10px;z-index:15}
.aviso{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--azul);border-radius:6px;padding:12px;box-shadow:0 6px 20px rgba(27,39,51,.18);animation:entra .25s ease-out}
.aviso.a-incidencia{border-left-color:var(--rojo)}
.aviso.a-fin_trabajo{border-left-color:var(--verde)}
.aviso.a-pausa{border-left-color:#A06A00}
.aviso.a-tarea{border-left-color:var(--verde)}
.aviso p{margin:6px 0}
@keyframes entra{from{opacity:0;transform:translateX(20px)}}
.aviso-fila.leido{opacity:.6}
nav .pin{font-style:normal;display:inline-block;min-width:20px;margin-left:6px;padding:0 5px;border-radius:99px;background:var(--rojo);color:#fff;font-size:.78rem;text-align:center}
.derecha{text-align:right}
.nota-relevo{background:#FFF6D6;border-left:4px solid var(--amar);padding:6px 10px;margin-top:8px;font-size:.92rem}
.ck-item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.ck-item .nota{grid-column:1/-1}
.ck-item .nota input{padding:5px 8px;font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:4px;overflow:hidden}
.seg label{position:relative;margin:0;cursor:pointer;color:var(--tinta)}
.seg label+label{border-left:1px solid var(--linea)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:7px 12px;font-weight:500}
.seg input:checked+span{background:var(--tinta);color:#fff}
.seg input[value=revisar]:checked+span{background:#A06A00}
.seg input:focus-visible+span{outline:3px solid var(--azul);outline-offset:-3px}
.sello{border:1px dashed var(--linea);border-radius:4px;padding:8px 12px;background:#F7F9FA;font-size:.92rem}
.sello strong{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-weight:600;color:var(--suave)}
.tabla{overflow-x:auto}
.vacio{text-align:center;padding:40px 16px}
.login{max-width:400px;margin:8vh auto}
.login h1{font-size:2.6rem}
dialog{border:0;border-radius:8px;padding:0;max-width:520px;width:calc(100% - 24px);color:var(--tinta)}
dialog::backdrop{background:rgba(27,39,51,.55)}
.dlg{padding:18px}
.acc{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.ver{opacity:1}
#toast.mal{background:var(--rojo)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top" hidden><div class="barra"><div class="logo" id="logo"></div><nav id="nav"></nav></div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="avisos" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═════════ utilidades ═════════ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Para comparar dos pintados: quitamos lo que cambia cada segundo (la cuenta atrás)
const normalizar = h => h.replace(/data-(t|rest)="[^"]*"/g, '')
                         .replace(/(class="cd[^"]*"[^>]*>)[^<]*/g, '$1');
const app = html => {
  const firma = normalizar(html);
  if (st.silencioso){
    // refresco automático: si no ha cambiado nada, no se toca la pantalla y así no parpadea
    if (firma === st.firma) return;
    const y = window.scrollY;
    $('#app').innerHTML = html;
    window.scrollTo({top: y});
  } else {
    $('#app').innerHTML = html;
    window.scrollTo({top: 0});
  }
  st.firma = firma;
  pintarFotos($('#app'));
};
const on = (sel, ev, fn) => document.querySelectorAll('#app ' + sel).forEach(el => el.addEventListener(ev, fn));
const fmtFecha = ts => ts ? new Date(ts * 1000).toLocaleString('es-ES', {dateStyle:'short', timeStyle:'short'}) : '';
const fmtMin = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m/60)} h ${m%60 ? m%60 + ' min' : ''}`.trim() : `${m} min`; };
function fmtCD(r){
  const neg = r < 0; let s = Math.abs(Math.round(r));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  const t = (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0');
  return (neg ? '−' : '') + t;
}
let toastT;
function toast(msg, mal=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'ver' + (mal ? ' mal' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3500);
}
const ETQ = {pendiente:'Pendiente', en_curso:'En curso', a_medias:'A medias', finalizada:'Finalizada',
             abierta:'Abierta', cancelada:'Cancelada', todas:'Todas'};
const badge = e => `<span class="estado e-${esc(e)}">${ETQ[e] || esc(e)}</span>`;
const CK_ETQ = {ok:'OK', revisar:'Revisar', na:'N/A'};

/* ═════════ datos (Supabase) ═════════ */
const CFG = window.TALLER_CONFIG || {};
const CONFIGURADO = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('TU-PROYECTO') && CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_ANON_KEY.includes('PEGA');
const sb = CONFIGURADO ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const DOMINIO = CFG.DOMINIO_USUARIOS || 'taller.app';
const aEmail = u => { u = (u || '').trim().toLowerCase(); return u.includes('@') ? u : u + '@' + DOMINIO; };
const MENSAJES = [
  [/Invalid login credentials/i, 'Usuario o contraseña incorrectos'],
  [/already registered|already been registered/i, 'Ese usuario ya existe'],
  [/Password should be at least/i, 'La contraseña debe tener al menos 6 caracteres'],
  [/Email address .* is invalid|invalid format/i, 'Usuario no válido: usa letras, números, punto o guion'],
  [/Email not confirmed/i, 'Falta desactivar "Confirm email" en Supabase (mira la guía)'],
  [/Signups not allowed/i, 'Falta activar el registro de usuarios en Supabase (mira la guía)'],
  [/JWT expired|invalid JWT/i, 'Tu sesión ha caducado. Vuelve a entrar'],
  [/Failed to fetch|NetworkError/i, 'Sin conexión con la base de datos'],
  [/rate limit/i, 'Demasiados intentos. Espera un momento'],
];
function traducir(m){ m = m || 'Error desconocido'; for (const [re, t] of MENSAJES) if (re.test(m)) return t; return m; }
async function ok(promesa){
  const {data, error} = await promesa;
  if (error){
    if (/JWT expired|invalid JWT/i.test(error.message)) salir(false);
    throw new Error(traducir(error.message));
  }
  return data;
}
const rpc = (fn, args) => ok(sb.rpc(fn, args));
const ts = v => v ? Date.parse(v) / 1000 : null;
let OFFSET = 0;
const srvAhora = () => (Date.now() + OFFSET) / 1000;
let NOMBRES = {};
async function cargarNombres(){
  const ps = await ok(sb.from('perfiles').select('id,nombre'));
  NOMBRES = Object.fromEntries(ps.map(p => [p.id, p.nombre]));
}
const nom = id => NOMBRES[id] || '—';
const uno1 = x => Array.isArray(x) ? (x[0] || null) : x;

function normTarea(t){
  return {
    id: t.id, orden_id: t.orden_id, titulo: t.titulo, descripcion: t.descripcion, estado: t.estado, pos: t.pos,
    seg_asignados: t.seg_asignados, seg_reales: t.seg_reales == null ? null : Number(t.seg_reales),
    finalizada: ts(t.finalizada),
    finalizada_por: t.finalizada_por ? nom(t.finalizada_por) : null,
    mecanicos: (t.tarea_mecanicos || []).map(m => ({id: m.mecanico_id, nombre: nom(m.mecanico_id)})).sort((a, b) => a.nombre.localeCompare(b.nombre)),
  };
}
function normOrden(o){
  const ahora = srvAhora();
  const tareas = (o.tareas || []).map(normTarea).sort((a, b) => a.pos - b.pos || a.id - b.id);
  const ses = o.orden_sesiones || [];
  const cks = [].concat(o.checklists || []);
  const normCk = k => k ? {creado: ts(k.creado), realizado_por: nom(k.realizado_por), modificado: ts(k.modificado),
      modificado_por: k.modificado_por ? nom(k.modificado_por) : null, datos: k.datos} : null;
  const ck = normCk(cks.find(k => (k.tipo || 'inicial') === 'inicial'));
  const ckFinal = normCk(cks.find(k => k.tipo === 'final'));
  const enMarcha = ts(o.en_marcha_desde);
  const paso = enMarcha ? ahora - enMarcha : 0;
  const consumido = Number(o.seg_consumidos) + paso;         // tiempo del tramo actual
  const seg_total = tareas.reduce((a, t) => a + t.seg_asignados, 0);
  const seg_pendiente = tareas.filter(t => t.estado !== 'finalizada').reduce((a, t) => a + t.seg_asignados, 0);
  const rel = ses.filter(x => x.motivo === 'fin_turno').sort((a, b) => ts(b.fin) - ts(a.fin))[0];
  return {
    id: o.id, estado: o.estado, tipo_revision: o.tipo_revision, tipo_checklist: o.tipo_checklist, notas: o.notas,
    creado: ts(o.creado), cerrado: ts(o.cerrado), coche: uno1(o.coche),
    checklist: ck, checklist_final: ckFinal,
    tareas, seg_total, seg_pendiente, seg_informe: seg_total + SEG_CHECKLISTS,
    consumido: Math.round(consumido), restante: Math.round(seg_pendiente - consumido),

/* ═════════ imágenes: fotos del checklist y logo del taller ═════════ */
const BUCKET = 'fotos';
const firmadas = new Map();
function reducir(file, max = 1280, calidad = 0.72){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Eso no es una imagen'));
    const img = new Image();
    img.onload = () => {
      const e = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la imagen')), 'image/jpeg', calidad);
    };
    img.onerror = () => rej(new Error('No se pudo leer la imagen'));
    img.src = URL.createObjectURL(file);
  });
}
async function subirFoto(file, ordenId){
  const blob = await reducir(file);
  const nombre = `${yo.taller_id}/${ordenId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const {error} = await sb.storage.from(BUCKET).upload(nombre, blob, {contentType: 'image/jpeg'});
  if (error) throw new Error(/bucket/i.test(error.message) ? 'Falta crear el almacén de fotos en Supabase (mira el README)' : traducir(error.message));
  firmadas.set(nombre, URL.createObjectURL(blob));
  return nombre;
}
async function pintarFotos(raiz = document){
  const els = [...raiz.querySelectorAll('img[data-foto]:not([src])')];
  if (!els.length || !sb) return;
  const pendientes = [...new Set(els.map(e => e.dataset.foto).filter(f => !firmadas.has(f)))];
  if (pendientes.length){
    const {data} = await sb.storage.from(BUCKET).createSignedUrls(pendientes, 3600);
    (data || []).forEach(d => { if (d.signedUrl) firmadas.set(d.path, d.signedUrl); });
  }
  els.forEach(e => { const u = firmadas.get(e.dataset.foto); if (u) e.src = u; });
}
document.addEventListener('click', e => {
  const im = e.target.closest('img[data-foto]');
  if (im && im.src && !e.target.closest('.picker')) window.open(im.src, '_blank');
});
const fotosDe = raiz => [...raiz.querySelectorAll('input[name=foto]')].map(i => i.value);
const miniatura = f => `<span class="mini"><img data-foto="${esc(f)}" alt="Foto del checklist">
  <button type="button" class="quitar" data-quitar aria-label="Quitar foto">×</button>
  <input type="hidden" name="foto" value="${esc(f)}"></span>`;
function activarFotos(root, ordenId){
  root.querySelectorAll('[data-subir]').forEach(inp => {
    inp.onchange = async e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      const zona = inp.closest('.fotos');
      zona.classList.add('subiendo');
      try {
        const ruta = await subirFoto(f, ordenId);
        inp.closest('label').insertAdjacentHTML('beforebegin', miniatura(ruta));
        pintarFotos(zona);
      } catch(x){ toast(x.message, true); }
      zona.classList.remove('subiendo');
    };
  });

    if (b) b.closest('.mini').remove();
  });
}

/* ═════════ desplegables de marca, modelo y año ═════════ */
const sinTildes = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const MARCAS = window.MARCAS || {};
const LISTA_MARCAS = Object.keys(MARCAS).sort((a, b) => a.localeCompare(b, 'es'));
const LISTA_ANIOS = (() => { const y = new Date().getFullYear() + 1, a = []; for (let i = y; i >= 1985; i--) a.push(String(i)); return a; })();

function combo(input, opciones){
  if (!input || input.dataset.combo) return;
  input.dataset.combo = '1';
  input.setAttribute('autocomplete', 'off');
  const caja = document.createElement('ul');
  caja.className = 'combo-lista';
  caja.hidden = true;
  input.insertAdjacentElement('afterend', caja);
  let activo = -1;
  const cerrar = () => { caja.hidden = true; activo = -1; };
  const elegir = v => { input.value = v; cerrar(); input.dispatchEvent(new Event('input', {bubbles: true})); };
  const pintar = () => {
    const q = sinTildes(input.value.trim());
    const todas = opciones();
    // primero las que empiezan por lo escrito, después las que lo contienen
    const empiezan = todas.filter(o => sinTildes(o).startsWith(q));
    const contienen = q ? todas.filter(o => !sinTildes(o).startsWith(q) && sinTildes(o).includes(q)) : [];
    const res = empiezan.concat(contienen).slice(0, 40);
    if (!res.length) return cerrar();
    caja.innerHTML = res.map((o, i) => `<li role="option" data-i="${i}">${esc(o)}</li>`).join('');
    caja.hidden = false; activo = -1;
    caja.querySelectorAll('li').forEach((li, i) => {
      li.onmousedown = e => { e.preventDefault(); elegir(res[i]); };
    });
  };
  const mover = paso => {
    const lis = [...caja.querySelectorAll('li')];
    if (!lis.length) return;
    activo = (activo + paso + lis.length) % lis.length;
    lis.forEach((li, i) => li.classList.toggle('sel', i === activo));
    lis[activo].scrollIntoView({block: 'nearest'});
  };
  input.addEventListener('focus', pintar);
  input.addEventListener('input', pintar);
  input.addEventListener('blur', () => setTimeout(cerrar, 120));
  input.addEventListener('keydown', e => {
    if (caja.hidden && (e.key === 'ArrowDown')) return pintar();
    if (e.key === 'ArrowDown'){ e.preventDefault(); mover(1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); mover(-1); }
    else if (e.key === 'Enter' && !caja.hidden && activo >= 0){ e.preventDefault(); elegir(caja.querySelectorAll('li')[activo].textContent); }
    else if (e.key === 'Escape') cerrar();
  });
}
function combosCoche(root){
  const g = n => root.querySelector(`[name=${n}]`);
  combo(g('marca'), () => LISTA_MARCAS);
  combo(g('modelo'), () => {
    const m = LISTA_MARCAS.find(x => sinTildes(x) === sinTildes(g('marca').value.trim()));
    return m ? MARCAS[m] : [];
  });
  combo(g('anio'), () => LISTA_ANIOS);
  // al cambiar de marca, el modelo que ya no encaja se borra
  g('marca').addEventListener('change', () => {
    const m = LISTA_MARCAS.find(x => sinTildes(x) === sinTildes(g('marca').value.trim()));
    const mod = g('modelo').value.trim();
    if (m && mod && !MARCAS[m].some(x => sinTildes(x) === sinTildes(mod))) g('modelo').value = '';
  });
}

function tono(hex, f){
  const n = parseInt(hex.slice(1), 16), c = [n>>16, n>>8&255, n&255];
  return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(f < 0 ? v*(1+f) : v+(255-v)*f)))
    .toString(16).padStart(2,'0')).join('');
}
function cocheSVG(c, run=false){
  const f = FORMAS[c.carroceria] || FORMAS.berlina;
  const col = /^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : '#3A6EA5';
  const rr = f.rr || 14, y = 80;
  const rueda = x => `<circle cx="${x}" cy="${y}" r="${rr+3}" fill="#1B2733"/>
    <g class="rueda"><circle cx="${x}" cy="${y}" r="${rr}" fill="#2B333C"/><circle cx="${x}" cy="${y}" r="${rr*.52}" fill="#C9D1D9"/>
    <path d="M${x-rr*.46} ${y}H${x+rr*.46}M${x} ${y-rr*.46}V${y+rr*.46}" stroke="#6F7C89" stroke-width="2.2"/></g>`;
  return `<svg class="coche-svg ${run ? 'gira' : ''}" viewBox="0 0 240 104" role="img" aria-label="${esc((c.marca||'') + ' ' + (c.modelo||''))}">
    <ellipse cx="120" cy="${y+rr+3}" rx="110" ry="4.5" fill="#1B2733" opacity=".16"/>
    <path d="${f.b}" fill="${col}" stroke="${tono(col,-.35)}" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="${f.l}" stroke="${tono(col,-.18)}" stroke-width="1.2" fill="none"/>
    ${f.v.map(p => `<path d="${p}" fill="#253545" opacity=".88"/><path d="${p}" fill="none" stroke="${tono(col,.45)}" stroke-width="1"/>`).join('')}
    <rect x="${f.f[0]}" y="${f.f[1]}" width="9" height="4.5" rx="2" fill="#FFF1BD" stroke="${tono(col,-.35)}" stroke-width=".6"/>
    <rect x="${f.p[0]}" y="${f.p[1]}" width="5" height="6" rx="1" fill="#D9453B"/>
    ${rueda(f.r[0])}${rueda(f.r[1])}
  </svg>`;
}

function datosCoche(c){

        if (!/^[a-z0-9._-]{3,40}$/.test(u)) throw new Error('El usuario debe tener 3-40 caracteres: letras, números, punto o guion');
        const d = await ok(sb.auth.signUp({email: aEmail(u), password: b.password}));
        if (!d.session) throw new Error('Falta desactivar "Confirm email" en Supabase (mira la guía)');
        try { await rpc('crear_taller', {p_taller: b.taller, p_nombre: b.nombre}); }
        catch(x){ await sb.auth.signOut({scope: 'local'}); throw x; }
      } else {
        await ok(sb.auth.signInWithPassword({email: aEmail(u), password: b.password}));
      }
      await arrancar();
    } catch(x){ toast(x.message, true); }
  };
}

async function arrancar(){
  const {data: {user}} = await sb.auth.getUser();
  if (!user) throw new Error('Inicia sesión');
  const p = await ok(sb.from('perfiles').select('id,nombre,usuario,rol,taller_id').eq('id', user.id).maybeSingle());
  if (!p){ await salir(false); throw new Error('Tu usuario está desactivado o no pertenece a ningún taller'); }
  TALLER = await ok(sb.from('talleres').select('*').eq('id', p.taller_id).single());
  yo = {...p, taller: TALLER.nombre};
  const [ahora, pl] = await Promise.all([rpc('ahora'), rpc('plantillas'), cargarNombres()]);
  OFFSET = Date.parse(ahora) - Date.now();
  PLANT = pl;
  cabecera();
  yo.rol === 'admin' ? await vOrdenes() : await mInicio();
  contarAvisos();
}

/* ═════════ checklist ═════════ */
function formChecklist(tipo, datos, ordenId){

  return `<div class="ck">${PLANT[tipo].map(p => `
    <div class="ck-item" data-id="${p.id}">
      <div>${esc(p.texto)}</div>

      <div class="nota"><input placeholder="Nota (opcional)" aria-label="Nota sobre ${esc(p.texto)}" value="${esc(it[p.id]?.nota || '')}"></div>

    <label>Observaciones<textarea name="ck-obs" rows="3">${esc(datos?.observaciones || '')}</textarea></label>
  </div>`;
}
function leerChecklist(root){
  const items = {};
  for (const row of root.querySelectorAll('.ck-item')){
    const sel = row.querySelector('input[type=radio]:checked');
    if (!sel){ row.scrollIntoView({block:'center'}); throw new Error('Falta revisar: ' + row.firstElementChild.textContent); }
    items[row.dataset.id] = {estado: sel.value, nota: row.querySelector('.nota input').value,
      fotos: [...row.querySelectorAll('input[name=foto]')].map(i => i.value)};
  }
  const km = root.querySelector('[name=ck-km]').value;
  return {items, km: km ? +km : null, observaciones: root.querySelector('[name=ck-obs]').value};
}
function panelChecklist(o, tipo, modo, id){
  const ck = tipo === 'final' ? o.checklist_final : o.checklist;
  const plantilla = tipo === 'final' ? 'final' : o.tipo_checklist;
  const titulo = tipo === 'final' ? 'Control final' : 'Checklist de entrada';
  const todas = o.n_tareas > 0 && o.n_finalizadas === o.n_tareas;
  let cuerpo;
  if (ck) cuerpo = verChecklist(plantilla, ck) + (modo === 'mec' ? '<p class="suave" style="margin-top:8px">Solo el personal de oficina puede modificarlo.</p>' : '');
  else if (modo === 'admin') cuerpo = `<p>Pendiente. Lo hará el mecánico${tipo === 'final' ? ' al terminar las reparaciones' : ' antes de empezar'}.</p>
    <button class="btn sec" data-ck-hacer="${tipo}">Hacerlo yo</button>`;
  else if (tipo === 'final' && !todas) cuerpo = '<p>Se hace cuando estén todas las reparaciones marcadas.</p>';
  else cuerpo = `<p>${tipo === 'final' ? 'Repasa el coche antes de entregarlo.' : 'Revisa cada punto antes de empezar. Las reparaciones aparecerán cuando lo guardes.'}</p>
    ${formChecklist(plantilla, null, id)}
    <button class="btn pri" data-ck-guardar="${tipo}" style="margin-top:12px">Guardar ${tipo === 'final' ? 'control final' : 'checklist'}</button>`;
  return `<div class="panel" id="ck-${tipo}">
    <div class="fila entre"><h2 style="margin:0">${titulo}</h2>
      ${ck && modo === 'admin' ? `<button class="btn sec" data-ck-editar="${tipo}">Editar</button>` : ''}</div>
    <div class="ck-cuerpo" style="margin-top:10px">${cuerpo}</div>
  </div>`;
}
function selloChecklist(ck){
  return `<div class="sello">
    <div>Realizado el <strong>${fmtFecha(ck.creado)}</strong> por ${esc(ck.realizado_por)}</div>
    ${ck.modificado ? `<div>Modificado el <strong>${fmtFecha(ck.modificado)}</strong> por ${esc(ck.modificado_por)}</div>` : ''}
  </div>`;
}
function verChecklist(tipo, ck){
  const it = ck.datos.items;
  const revisar = PLANT[tipo].filter(p => it[p.id]?.estado === 'revisar');
  return `${selloChecklist(ck)}

    <details style="margin-top:8px"><summary>Ver checklist completo</summary>
      <table><tbody>${PLANT[tipo].map(p => `<tr><td>${esc(p.texto)}</td><td>${CK_ETQ[it[p.id]?.estado] || ''}</td>

          ${(it[p.id]?.fotos || []).length ? `<div class="fotos">${it[p.id].fotos.map(f => `<span class="mini"><img data-foto="${esc(f)}" alt="Foto del checklist"></span>`).join('')}</div>` : ''}</td></tr>`).join('')}</tbody></table>

/* ═════════ tareas ═════════ */
function bloqueTrabajo(o, modo){
  const run = o.en_marcha, abierta = o.estado === 'abierta';
  const trabajando = modo === 'mec' && o.activos.some(a => a.id === yo.id);
  const verTiempo = modo === 'admin' || trabajando || !abierta;   // el mecánico lo ve al empezar
  const puedoMarcar = abierta && (modo === 'admin' || trabajando);
  const todas = o.n_tareas > 0 && o.n_finalizadas === o.n_tareas;
  const filas = o.tareas.map(t => {
    const mia = modo === 'admin' || t.mecanicos.some(m => m.id === yo.id);
    const hecha = t.estado === 'finalizada';
    return `<div class="rep${hecha ? ' hecha' : ''}">
      <label class="chk-rep">
        <input type="checkbox" data-marcar="${t.id}" ${hecha ? 'checked' : ''} ${puedoMarcar && mia ? '' : 'disabled'}>
        <span><strong>${esc(t.titulo)}</strong>
          ${t.descripcion ? `<br>${esc(t.descripcion)}` : ''}
          <br><span class="suave">${esc(t.mecanicos.map(m => m.nombre).join(', ') || 'sin asignar')}${modo === 'admin' ? `, ${fmtMin(t.seg_asignados)}` : ''}</span>
          ${hecha ? `<br><span class="suave">Hecha el ${fmtFecha(t.finalizada)}${t.finalizada_por ? ', por ' + esc(t.finalizada_por) : ''}${modo === 'admin' && t.seg_reales != null ? `, en ${fmtMin(t.seg_reales)}` : ''}</span>` : ''}
        </span>
      </label>
      <div class="fila">
        ${modo === 'mec' && mia && !hecha && trabajando ? `<button class="btn sec" data-incidencia="${t.id}">Incidencia</button>` : ''}
        ${modo === 'admin' ? `<button class="btn sec" data-editar="${t.id}">Editar</button>
          ${hecha ? '' : `<button class="btn peligro" data-borrar="${t.id}">Eliminar</button>`}` : ''}
      </div>
    </div>`;
  }).join('') || '<p>Sin reparaciones.</p>';
  let acc = '';
  if (modo === 'mec' && abierta){
    if (trabajando){
      const puedeTerminar = todas && o.checklist_final;
      acc = `<button class="btn ok" data-fin="${o.id}" ${puedeTerminar ? '' : 'disabled'}>Finalizar trabajo</button>
             <button class="btn sec" data-pausar="${o.id}">Pausar</button>
             <button class="btn sec" data-nota="${o.id}">Nota al taller</button>
             ${puedeTerminar ? '' : `<span class="suave">${todas ? 'Haz el control final para poder terminar' : 'Marca todas las reparaciones'}</span>`}`;
    } else {
      acc = `<button class="btn pri" data-empezar="${o.id}">${run ? 'Unirme al trabajo' : o.tiene_sesiones ? 'Continuar trabajo' : 'Empezar trabajo'}</button>`;
    }
  }
  return `<article class="panel tarea${run ? ' run' : ''}">
    <div class="fila entre" style="align-items:flex-start;flex-wrap:nowrap">
      <div style="min-width:0">
        <h2 style="margin:0">Reparaciones</h2>
        <div class="suave">${o.n_finalizadas} de ${o.n_tareas} hechas</div>
        ${run ? `<p><strong>Trabajando:</strong> ${esc(o.activos.map(a => a.nombre).join(', '))}</p>` : ''}
      </div>
      <div class="derecha">
        ${!verTiempo
          ? `<div class="cd oculto" aria-hidden="true">--:--</div><div class="suave">Al empezar</div>`
          : todas
            ? `<div class="cd hecho">✓</div><div class="suave">Todo marcado, ${fmtMin(o.seg_reales)} reales</div>`
            : `<div class="cd" data-rest="${o.restante}" data-run="${run ? 1 : 0}" data-t="${Date.now()}">${fmtCD(o.restante)}</div>
               <div class="suave">para ${fmtMin(o.seg_pendiente)} pendientes</div>`}
      </div>
    </div>
    ${o.relevo && abierta ? `<div class="nota-relevo">Relevo de ${esc(o.relevo.de)}${o.relevo.para ? ' para ' + esc(o.relevo.para) : ''}, ${fmtFecha(o.relevo.fin)}${o.relevo.nota ? ': ' + esc(o.relevo.nota) : ''}</div>` : ''}
    <div class="reps">${filas}</div>
    ${modo === 'admin' ? `<div class="fila" style="margin-top:12px"><button class="btn pri" id="t-nueva">Añadir reparación</button></div>` : ''}
    ${acc ? `<div class="fila" style="margin-top:12px">${acc}</div>` : ''}
  </article>`;
}

function tarjetaOrden(o, destino){
  const pct = o.n_tareas ? Math.round(o.n_finalizadas / o.n_tareas * 100) : 0;
  const run = o.en_marcha;
  const mec = destino === 'mio';
  const resumen = mec && !o.checklist
    ? '<div class="suave">Checklist pendiente. Hazlo para ver las reparaciones.</div>'
    : `<div class="barra-prog"><i style="width:${pct}%"></i></div>
       <div class="suave">${o.n_finalizadas} de ${o.n_tareas} reparaciones hechas${mec ? '' : `, ${fmtMin(o.seg_total)} en total`}</div>
       <div class="suave">${o.checklist ? 'Checklist hecho' : 'Checklist pendiente'}${run ? ', trabajando ahora' : ''}</div>`;
  return `<button class="panel tarjeta" data-${destino}="${o.id}">
    <div class="escena">${cocheSVG(o.coche, run)}</div>
    <div class="fila entre" style="margin-top:8px">${placa(o.coche.matricula)}${badge(o.estado)}</div>
    <h3 style="margin:8px 0 0">${esc(o.coche.marca)} ${esc(o.coche.modelo)}</h3>
    <div class="suave">${esc(o.tipo_revision)}</div>
    ${resumen}
  </button>`;
}

function camposCoche(c){
  return `<div class="grid">
    <label>Matrícula<input name="matricula" value="${esc(c.matricula || '')}" required></label>
    <label class="combo">Marca<input name="marca" value="${esc(c.marca || '')}" placeholder="Escribe y elige" required></label>
    <label class="combo">Modelo<input name="modelo" value="${esc(c.modelo || '')}" placeholder="Escribe y elige" required></label>
    <label class="combo">Año<input name="anio" inputmode="numeric" maxlength="4" value="${esc(c.anio || '')}"></label>
    <label>Kilómetros<input name="km" type="number" min="0" value="${esc(c.km ?? '')}"></label>
    <label>Carrocería<select name="carroceria">${Object.entries(CARROCERIAS).map(([k,v]) => `<option value="${k}" ${c.carroceria === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>Color<input name="color" type="color" value="${esc(c.color || '#3A6EA5')}"></label>
    <label>Bastidor (VIN)<input name="vin" maxlength="17" value="${esc(c.vin || '')}"></label>
  </div>
  <label>Notas del coche<input name="notas" value="${esc(c.notas || '')}"></label>`;
}
function leerCoche(root){
  const g = n => root.querySelector(`[name=${n}]`).value.trim();
  const c = {matricula:g('matricula'), marca:g('marca'), modelo:g('modelo'), anio:g('anio') ? +g('anio') : null,
    km:g('km') ? +g('km') : null, carroceria:g('carroceria'), color:g('color'), vin:g('vin') || null, notas:g('notas') || null};
  if (!c.matricula || !c.marca || !c.modelo) throw new Error('Pon matrícula, marca y modelo');
  return c;
}
function enlazarPreview(root, prev){
  combosCoche(root);
  const pintar = () => { try { const c = leerCocheParcial(root); prev.innerHTML = cocheSVG(c) +
    `<div class="fila entre" style="padding:6px 0 10px"><strong>${esc(c.marca || 'Marca')} ${esc(c.modelo || 'modelo')}</strong>${c.matricula ? placa(c.matricula.toUpperCase()) : ''}</div>`; } catch(e){} };
  root.addEventListener('input', pintar); pintar();
}
function leerCocheParcial(root){
  const g = n => root.querySelector(`[name=${n}]`)?.value.trim() || '';
  return {matricula:g('matricula'), marca:g('marca'), modelo:g('modelo'), carroceria:g('carroceria'), color:g('color')};
}

      <div id="n-prev" class="escena" style="margin-top:12px"></div>
      <div id="n-campos">${camposCoche({})}</div>
    </section>
    <section class="panel">
      <h2>Trabajo</h2>
      <label>Tipo de revisión<input id="n-tipo" list="tipos"></label>
      <datalist id="tipos"><option>Mantenimiento</option><option>Revisión oficial</option><option>Pre-ITV</option><option>Reparación</option><option>Diagnóstico</option><option>Neumáticos</option></datalist>
      <label>Notas para el mecánico<textarea id="n-notas" rows="2"></textarea></label>
      <h3 style="margin-top:16px">Reparaciones</h3>
      <div id="n-tareas">${filaTarea()}</div>
      <button class="btn sec" id="n-add">Añadir reparación</button>
      <p style="margin-top:14px">Tiempo total: <strong id="n-total">0 min</strong></p>
      <button class="btn pri" id="n-guardar">Crear orden</button>
    </section>
  </div>`);
  const campos = $('#n-campos'), prev = $('#n-prev');
  enlazarPreview(campos, prev);
  $('#n-sel').onchange = e => {
    const c = coches.find(x => x.id === +e.target.value);
    campos.hidden = !!c;
    if (c) prev.innerHTML = cocheSVG(c) + `<div class="fila entre" style="padding:6px 0 10px"><strong>${esc(c.marca)} ${esc(c.modelo)}</strong>${placa(c.matricula)}</div>`;
    else campos.dispatchEvent(new Event('input'));
  };
  const total = () => $('#n-total').textContent = fmtMin([...document.querySelectorAll('.t-min')].reduce((a, i) => a + (+i.value || 0), 0) * 60);
  const zona = $('#n-tareas');
  zona.addEventListener('input', total);
  zona.addEventListener('click', e => { if (e.target.classList.contains('t-quitar')){ e.target.closest('.t-fila').remove(); total(); } });
  $('#n-add').onclick = () => zona.insertAdjacentHTML('beforeend', filaTarea());
  $('#n-guardar').onclick = accion(async () => {
    const body = {tipo_revision: $('#n-tipo').value.trim(), tipo_checklist: 'completo', notas: $('#n-notas').value, tareas: []};
    if (!body.tipo_revision) throw new Error('Indica el tipo de revisión');
    const sel = +$('#n-sel').value;
    sel ? body.coche_id = sel : body.coche = leerCoche(campos);
    for (const f of zona.querySelectorAll('.t-fila')){
      const t = {titulo: f.querySelector('.t-tit').value.trim(), descripcion: f.querySelector('.t-desc').value.trim(),
        minutos: +f.querySelector('.t-min').value, mecanicos: [...f.querySelectorAll('fieldset input:checked')].map(x => x.value)};
      if (!t.titulo && !t.minutos) continue;
      if (!t.titulo || !t.minutos) throw new Error('Cada reparación necesita nombre y minutos');
      if (!t.mecanicos.length) throw new Error(`Asigna al menos un mecánico a «${t.titulo}»`);
      body.tareas.push(t);
    }
    if (!body.tareas.length) throw new Error('Añade al menos una reparación');
    const nuevaId = await rpc('crear_orden', {p: body});
    toast('Orden creada'); vOrden(nuevaId);
  });
}

/* ═════════ ADMIN: datos del taller ═════════ */
function reducirImagen(file, max = 400, calidad = 0.85){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Elige un archivo de imagen'));
    const img = new Image();
    img.onload = () => {
      const e = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      // PNG si la imagen puede tener transparencia, si no JPEG, que pesa menos
      const png = /png|webp|svg/i.test(file.type);
      res(c.toDataURL(png ? 'image/png' : 'image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); rej(new Error('No se pudo leer la imagen')); };
    img.src = URL.createObjectURL(file);
  });
}

/* ═════════ turnos ═════════ */
const H0 = 6, H1 = 22, MIN_DIA = (H1 - H0) * 60;
const hhmm = d => d.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
const diaLargo = d => d.toLocaleDateString('es-ES', {weekday: 'long', day: 'numeric', month: 'long'});
const aISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const minsDe = d => d.getHours() * 60 + d.getMinutes();
const pct = m => Math.max(0, Math.min(100, (m - H0 * 60) / MIN_DIA * 100));
function duracion(a, b){ return fmtMin((b - a) / 1000); }

async function vTurnos(){
  marcar('turnos'); st.refresh = null;
  const dia = st.diaTurnos ? new Date(st.diaTurnos) : new Date();
  dia.setHours(0, 0, 0, 0);
  st.diaTurnos = dia.getTime();
  const finDia = new Date(dia.getTime() + 86400000);
  const [mecs, turnos, plantillas] = await Promise.all([DB.mecanicos(), DB.turnos(dia, finDia), DB.plantillasTurno()]);
  const activos = mecs.filter(m => m.activo);
  const horas = [];
  for (let h = H0; h <= H1; h++) horas.push(h);
  const bloque = t => {
    const i = pct(minsDe(t.inicio)), f = pct(t.fin.getDate() !== t.inicio.getDate() ? H1 * 60 : minsDe(t.fin));
    return `<div class="turno" data-turno="${t.id}" style="left:${i}%;width:${Math.max(f - i, 3)}%">
      <strong>${hhmm(t.inicio)} - ${hhmm(t.fin)}</strong>
      ${t.comentario ? `<span>${esc(t.comentario)}</span>` : ''}</div>`;
  };
  app(`<div class="fila cab"><h1>Turnos</h1>
      <div class="fila">
        <button class="btn sec" data-dia="-1">← Día anterior</button>
        <input type="date" id="t-dia" value="${aISO(dia)}" style="width:auto">
        <button class="btn sec" data-dia="1">Día siguiente →</button>
      </div></div>
    <p><strong>${diaLargo(dia)}</strong></p>
    <div class="panel">
      <div class="fila entre">
        <div class="fila" id="plantillas">
          ${plantillas.map(p => `<button class="btn sec chip" data-plantilla="${p.id}">${esc(p.nombre)}
            <span class="suave">${p.hora_inicio.slice(0,5)}-${p.hora_fin.slice(0,5)}</span></button>`).join('')
            || '<span class="suave">Sin turnos predefinidos</span>'}
        </div>
        <button class="btn sec" id="t-plantillas">Turnos predefinidos</button>
      </div>
      <p class="suave" id="t-pista" style="margin-top:8px">Arrastra sobre la línea de un mecánico para crear un turno. Con un turno predefinido elegido, basta con tocar su fila.</p>
      <div class="rejilla">
        <div class="rej-cab"><div></div><div class="horas">${horas.map(h => `<span>${h}</span>`).join('')}</div></div>
        ${activos.map(m => `<div class="rej-fila">
          <div class="rej-nombre">${esc(m.nombre)}</div>
          <div class="pista" data-mec="${m.id}">
            ${horas.slice(0, -1).map((h, i) => `<i style="left:${i / (horas.length - 1) * 100}%"></i>`).join('')}
            ${turnos.filter(t => t.mecanico_id === m.id).map(bloque).join('')}
          </div></div>`).join('') || '<p>Crea antes algún mecánico.</p>'}
      </div>
    </div>`);
  $('#t-dia').onchange = e => { st.diaTurnos = new Date(e.target.value + 'T00:00').getTime(); vTurnos(); };
  on('[data-dia]', 'click', e => {
    st.diaTurnos = dia.getTime() + Number(e.currentTarget.dataset.dia) * 86400000; vTurnos();
  });
  let elegida = null;
  on('[data-plantilla]', 'click', e => {
    const b = e.currentTarget;
    const ya = b.classList.contains('pri');
    document.querySelectorAll('[data-plantilla]').forEach(x => x.classList.replace('pri', 'sec'));
    elegida = ya ? null : plantillas.find(p => p.id === +b.dataset.plantilla);
    if (!ya) b.classList.replace('sec', 'pri');
    $('#t-pista').textContent = elegida
      ? `Toca la fila de un mecánico para ponerle el turno de ${elegida.nombre}.`
      : 'Arrastra sobre la línea de un mecánico para crear un turno.';
  });

  const conHora = (base, min) => new Date(base.getTime() + min * 60000);
  const redondea = m => Math.round(m / 15) * 15;
  const minDesdeX = (pista, x) => {
    const r = pista.getBoundingClientRect();
    return redondea(H0 * 60 + Math.max(0, Math.min(1, (x - r.left) / r.width)) * MIN_DIA);
  };
  const crear = async (mecId, min1, min2) => {
    try {
      await rpc('guardar_turno', {p_id: null, p_mecanico: mecId,
        p_inicio: conHora(dia, min1).toISOString(), p_fin: conHora(dia, min2).toISOString(), p_comentario: null});
      toast('Turno creado'); vTurnos();
    } catch(x){ toast(x.message, true); }
  };
  document.querySelectorAll('.pista').forEach(pista => {
    let ini = null, fantasma = null;
    pista.addEventListener('pointerdown', e => {
      if (e.target.closest('.turno')) return;
      if (elegida){
        const [h1, m1] = elegida.hora_inicio.split(':').map(Number);
        const [h2, m2] = elegida.hora_fin.split(':').map(Number);
        return crear(pista.dataset.mec, h1 * 60 + m1, h2 * 60 + m2);
      }
      ini = minDesdeX(pista, e.clientX);
      pista.setPointerCapture(e.pointerId);
      fantasma = document.createElement('div');
      fantasma.className = 'turno fantasma';
      pista.appendChild(fantasma);
    });
    pista.addEventListener('pointermove', e => {
      if (ini === null) return;
      const ahora = minDesdeX(pista, e.clientX);
      const a = Math.min(ini, ahora), b = Math.max(ini, ahora);
      fantasma.style.left = pct(a) + '%';
      fantasma.style.width = (pct(b) - pct(a)) + '%';
      fantasma.innerHTML = `<strong>${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')} - ${String(Math.floor(b/60)).padStart(2,'0')}:${String(b%60).padStart(2,'0')}</strong>`;
    });
    pista.addEventListener('pointerup', e => {
      if (ini === null) return;
      const fin = minDesdeX(pista, e.clientX);
      const a = Math.min(ini, fin), b = Math.max(ini, fin);
      ini = null; fantasma?.remove(); fantasma = null;
      if (b - a >= 30) crear(pista.dataset.mec, a, b);
    });
    pista.addEventListener('pointercancel', () => { ini = null; fantasma?.remove(); fantasma = null; });
  });

  on('[data-turno]', 'click', e => {
    const t = turnos.find(x => x.id === +e.currentTarget.dataset.turno);
    dialogo(`<h2>Turno de ${esc(nom(t.mecanico_id))}</h2>
      <div class="pila">
        <label>Mecánico<select id="d-mec">${activos.map(m => `<option value="${m.id}" ${m.id === t.mecanico_id ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}</select></label>
        <div class="grid" style="margin:0">
          <label>Empieza<input type="time" id="d-ini" value="${hhmm(t.inicio)}"></label>
          <label>Acaba<input type="time" id="d-fin" value="${hhmm(t.fin)}"></label>
        </div>
        <label>Comentario para el mecánico<textarea id="d-com" rows="3">${esc(t.comentario || '')}</textarea></label>
      </div>`, 'Guardar', async d => {
        const h = (sel) => { const [hh, mm] = d.querySelector(sel).value.split(':').map(Number); return conHora(dia, hh * 60 + mm).toISOString(); };
        await rpc('guardar_turno', {p_id: t.id, p_mecanico: d.querySelector('#d-mec').value,
          p_inicio: h('#d-ini'), p_fin: h('#d-fin'), p_comentario: d.querySelector('#d-com').value});
        toast('Turno guardado'); vTurnos();
      }, 'pri', {extra: {txt: 'Eliminar', clase: 'peligro', fn: () => {
        dialogo('<h2>Eliminar turno</h2><p>Se quitará del cuadrante.</p>', 'Eliminar', async () => {
          await rpc('borrar_turno', {p_id: t.id}); toast('Turno eliminado'); vTurnos();
        }, 'peligro');

const TIPO_AVISO = {incidencia:'Incidencia', nota:'Nota', fin_turno:'Fin de turno',
                    tarea:'Reparación hecha', fin_trabajo:'Coche terminado', pausa:'Pausa'};

function cajaAviso(a){
  const caja = document.createElement('div');
  caja.className = 'aviso a-' + a.tipo;
  caja.innerHTML = `<div class="fila entre"><strong>${TIPO_AVISO[a.tipo]}</strong><span class="suave">${fmtFecha(a.creado)}</span></div>
    <p>${esc(a.texto)}</p>

    <div class="fila"><button class="btn sec" data-ver>Ver coche</button><button class="btn sec" data-ok>Marcar leído</button></div>`;
  const quitar = () => caja.remove();
  caja.querySelector('[data-ver]').onclick = async () => {
    quitar();
    try { await rpc('marcar_avisos', {p_ids: [a.id]}); } catch(e){}
    vOrden(a.orden_id).catch(x => toast(x.message, true));
    contarAvisos();

  caja.querySelector('[data-ok]').onclick = async () => {
    quitar();
    try { await rpc('marcar_avisos', {p_ids: [a.id]}); contarAvisos(); } catch(x){ toast(x.message, true); }
  };
  $('#avisos').appendChild(caja);
  pintarFotos(caja);
  setTimeout(quitar, 60000);   // la caja se va sola al minuto; el aviso sigue sin leer
}
async function contarAvisos(){
  if (yo?.rol !== 'admin') return;
  try {
    const nuevos = await DB.avisos(true);
    const pin = $('#nav .pin');
    if (pin){ pin.hidden = !nuevos.length; pin.textContent = nuevos.length; }
    nuevos.slice(0, 3).forEach(a => { if (!avisosVistos.has(a.id)){ avisosVistos.add(a.id); cajaAviso(a); } });
    nuevos.forEach(a => avisosVistos.add(a.id));
  } catch(e){}
}

const MOT = {finalizada:'Trabajo finalizado', fin_turno:'Fin de turno', cerrada_admin:'Cerrada por la oficina'};
function descargarCSV(nombre, cabeceras, filas){
  const celda = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '\ufeff' + [cabeceras].concat(filas).map(l => l.map(celda).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = nombre + '-' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(a.href);
}

    descargarCSV('reparaciones', ['Fecha','Reparación','Orden','Revisión','Matrícula','Marca','Modelo','Mecánico','Min. asignados','Min. reales'],
      rows.map(r => [f(r.finalizada), r.reparacion, r.orden_id, r.tipo_revision, r.matricula, r.marca, r.modelo, r.mecanico,
        n(r.minutos), r.minutos_reales == null ? '' : n(r.minutos_reales)]));
  });
  await buscar();
}

/* ═════════ MECÁNICO ═════════ */
const FICHAJES = {entrada:'Entrada a trabajar', descanso:'Salida para descanso', vuelta:'Vuelta del descanso', fin:'Fin de turno'};
const SIGUIENTES = {fin:['entrada'], entrada:['descanso','fin'], vuelta:['descanso','fin'], descanso:['vuelta','fin']};
function panelFichaje(fichajes){
  const ultimo = fichajes[0]?.tipo || 'fin';
  const estado = {entrada:'Trabajando', vuelta:'Trabajando', descanso:'En el descanso', fin:'Fuera de turno'}[ultimo];
  const hoy = fichajes.slice().reverse();
  return `<div class="panel ficha">
    <div class="fila entre">
      <div><h2 style="margin:0">Jornada</h2><div class="suave">${estado}${fichajes[0] ? `, desde las ${new Date(fichajes[0].momento * 1000).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})}` : ''}</div></div>
      <div class="fila">${SIGUIENTES[ultimo].map(t =>
        `<button class="btn ${t === 'entrada' ? 'ok' : t === 'fin' ? 'sec' : 'pri'}" data-fichar="${t}">${FICHAJES[t]}</button>`).join('')}</div>
    </div>
    ${hoy.length ? `<div class="suave" style="margin-top:10px">Hoy: ${hoy.map(f =>
      `${FICHAJES[f.tipo]} ${new Date(f.momento * 1000).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})}`).join(' · ')}</div>` : ''}
  </div>`;
}

async function mInicio(){
  marcar('inicio');
  const [os, fichajes] = await Promise.all([DB.ordenes('abierta'), DB.fichajes().catch(() => [])]);
  app(`<h1>Mis coches</h1>
    ${panelFichaje(fichajes)}
    ${os.length ? `<div class="lista">${os.map(o => tarjetaOrden(o, 'mio')).join('')}</div>`
      : '<div class="panel vacio"><p>No tienes coches asignados ahora mismo.</p><p class="suave">Cuando la oficina te asigne trabajo aparecerá aquí.</p></div>'}`);
  on('[data-mio]', 'click', e => mOrden(+e.currentTarget.dataset.mio));
  on('[data-fichar]', 'click', accion(async (e, b) => {
    const t = b.dataset.fichar;
    const aviso = t === 'descanso' ? 'Se parará el tiempo del coche que lleves.'
      : t === 'fin' ? 'Se parará el tiempo del coche que lleves y quedará a medias.' : '';
    if (aviso){
      dialogo(`<h2>${FICHAJES[t]}</h2><p>${aviso}</p>`, 'Fichar', async () => {
        await rpc('fichar', {p_tipo: t}); toast(FICHAJES[t] + ' fichada'); mInicio();
      });
    } else {
      await rpc('fichar', {p_tipo: t}); toast(FICHAJES[t] + ' fichada'); mInicio();
    }
  }));
  st.refresh = mInicio;
}

async function mOrden(id, trasMarcar){
  marcar('inicio');
  let o;
  try { o = await DB.orden(id); }
  catch(x){ toast(x.message, true); return mInicio(); }
  if (o.estado !== 'abierta'){ toast('Este coche ya está cerrado'); return mInicio(); }
  const run = o.en_marcha, ck = !!o.checklist;
  const todas = o.n_tareas > 0 && o.n_finalizadas === o.n_tareas;
  app(`<p><button class="lnk" id="volver">Volver a mis coches</button></p>
  <div class="dos ${ck ? 'tareas-primero' : ''}">
    <section class="pila">
      <div class="panel">${fichaCoche(o.coche, run)}
        <p style="margin-top:10px"><strong>${esc(o.tipo_revision)}</strong></p>
        ${o.notas ? `<div class="nota-relevo">${esc(o.notas)}</div>` : ''}
        ${o.coche.notas ? `<p class="suave">Notas del coche: ${esc(o.coche.notas)}</p>` : ''}
      </div>
      ${panelChecklist(o, 'inicial', 'mec', id)}
    </section>
    ${ck ? `<section class="pila">
      ${bloqueTrabajo(o, 'mec')}
      ${todas || o.checklist_final ? panelChecklist(o, 'final', 'mec', id) : ''}
    </section>` : ''}
  </div>`);
  $('#volver').onclick = () => mInicio();
  document.querySelectorAll('#app .ck-cuerpo').forEach(z => activarFotos(z, id));
  const recargar = marcada => mOrden(id, marcada === true);
  on('[data-ck-guardar]', 'click', e => {
    const tipo = e.currentTarget.dataset.ckGuardar;
    const zona = $('#ck-' + tipo).querySelector('.ck-cuerpo');
    let b;
    try { b = leerChecklist(zona); } catch(x){ return toast(x.message, true); }
    const texto = tipo === 'final'
      ? `<h2>¿Guardar el control final?</h2>
         <p>Se guardará con la fecha y hora actuales y ya no podrás editarlo, solo el personal de oficina.</p>
         <p>Después podrás pulsar <strong>Finalizar trabajo</strong>.</p>`
      : `<h2>¿Seguro que quieres guardarlo?</h2>
         <p>Se guardará con la fecha y hora actuales y ya no podrás editarlo, solo el personal de oficina.</p>
         <p><strong>Al guardarlo empezarán las reparaciones:</strong> el tiempo del coche se pondrá en marcha de forma automática.</p>`;
    dialogo(texto, tipo === 'final' ? 'Guardar control final' : 'Guardar y empezar', async () => {
      await rpc('hacer_checklist', {p_orden: id, p_datos: b, p_tipo: tipo});
      if (tipo === 'inicial'){
        try { await rpc('iniciar_orden', {p_orden: id}); toast('Checklist guardado. El tiempo está en marcha'); }
        catch(x){ toast('Checklist guardado, pero no se pudo arrancar el tiempo: ' + x.message, true); }
      } else toast('Control final guardado');
      recargar();
    });
  });
  marcarReparaciones(recargar);
  accionesMecanico(o, recargar, t => dlgIncidencia(t));
  on('[data-empezar]', 'click', accion(async () => {
    await rpc('iniciar_orden', {p_orden: id}); toast('Tiempo en marcha'); recargar();
  }));
  on('[data-fin]', 'click', () => {
    dialogo('<h2>Finalizar el trabajo</h2><p>El coche quedará terminado y se parará el tiempo para todos los que estén en él. No se puede deshacer.</p>',
      'Finalizar', async () => { await rpc('terminar_orden', {p_orden: id, p_motivo: 'finalizada'}); toast('Trabajo finalizado'); mInicio(); }, 'ok');
  });
  const dlgIncidencia = (tarea) => {
    dialogo(`<h2>Incidencia${tarea ? ` en «${esc(tarea.titulo)}»` : ''}</h2>
      <p>Se <strong>parará el tiempo</strong> del coche y le llegará un aviso a la oficina. Podrás continuar cuando se resuelva.</p>
      ${tarea ? '' : `<label style="margin-top:10px">¿En qué reparación?<select id="d-tarea"><option value="">En el coche en general</option>
        ${o.tareas.filter(t => t.estado !== 'finalizada').map(t => `<option value="${t.id}">${esc(t.titulo)}</option>`).join('')}</select></label>`}
      <label style="margin-top:10px">¿Qué ha pasado?<textarea id="d-nota" rows="4" placeholder="Falta una pieza, el tornillo está pasado de rosca..."></textarea></label>
      <div class="fotos"><label class="btn sec foto-btn">Añadir foto<input type="file" accept="image/*" capture="environment" hidden data-subir></label></div>`,
      'Enviar y parar el tiempo', async d => {
        await rpc('crear_incidencia', {p_orden: o.id, p_nota: d.querySelector('#d-nota').value,
          p_tarea: tarea ? tarea.id : (+d.querySelector('#d-tarea').value || null), p_fotos: fotosDe(d)});
        toast('Incidencia enviada. El tiempo está parado'); recargar();
      }, 'peligro', {alAbrir: d => activarFotos(d, o.id)});
  };
  const dlgOtro = () => {
    dialogo(`<h2>Pausar el trabajo</h2>
      <p>Se parará el tiempo del coche y la oficina verá el motivo.</p>
      <label style="margin-top:10px">Motivo<textarea id="d-mot" rows="3" placeholder="Voy a por una pieza al almacén"></textarea></label>`,
      'Pausar', async d => {
        await rpc('pausar_orden', {p_orden: o.id, p_motivo: d.querySelector('#d-mot').value});
        toast('Trabajo pausado'); mInicio();
      });
  };
  const dlgFinTurno = async () => {
    const comp = await DB.companeros().catch(() => []);
    dialogo(`<h2>Fin de turno</h2>
      <p>El coche queda a medias y quien lo continúe recibirá el tiempo restante y las reparaciones sin marcar.</p>
      <div class="pila" style="margin-top:10px">
        <label>¿Quién continúa?<select id="d-rel"><option value="">Los ya asignados</option>
          ${comp.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></label>
        <label>Nota para el relevo y el taller<textarea id="d-nota" rows="3" placeholder="Qué has hecho y qué falta"></textarea></label>
      </div>`, 'Terminar mi turno', async d => {
        await rpc('terminar_orden', {p_orden: id, p_motivo: 'fin_turno',
          p_relevo: d.querySelector('#d-rel').value || null, p_nota: d.querySelector('#d-nota').value});
        toast('Turno cerrado'); mInicio();
      });
  };
  on('[data-pausar]', 'click', () => {
    dialogo(`<h2>Pausar el trabajo</h2><p>¿Por qué paras? El tiempo del coche se detendrá.</p>
      <div class="pila" style="margin-top:12px">
        <button class="btn peligro" data-p="incidencia" style="width:100%">Incidencia</button>
        <button class="btn sec" data-p="turno" style="width:100%">Fin de turno o descanso</button>
        <button class="btn sec" data-p="otro" style="width:100%">Otro motivo</button>
      </div>`, 'Cancelar', async () => {}, 'sec', {cancel: null});
    const d = $('#dlg');
    d.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      d.close();
      if (b.dataset.p === 'incidencia') dlgIncidencia(null);
      else if (b.dataset.p === 'turno') dlgFinTurno();
      else dlgOtro();
    });
  });
  if (trasMarcar && o.estado === 'abierta'){
    if (todas){
      dialogo(`<h2>Reparación marcada</h2>
        <p>Ya están todas hechas. Falta el <strong>control final</strong> para poder entregar el coche.</p>
        <p><strong>El tiempo sigue corriendo</strong> mientras decides.</p>`,
        'Hacer control final', async () => { $('#ck-final')?.scrollIntoView({behavior:'smooth', block:'center'}); },
        'pri', {cancel: null, extra: {txt: 'Fin de turno', fn: dlgFinTurno}});
    } else {
      dialogo(`<h2>Reparación marcada</h2>
        <p>Quedan ${o.n_tareas - o.n_finalizadas} por hacer, con ${fmtMin(o.seg_pendiente)} de tiempo.</p>
        <p>¿Sigues con la siguiente o cierras el turno? <strong>El tiempo sigue corriendo</strong> mientras decides.</p>`,
        'Seguir trabajando', async () => {}, 'pri', {cancel: null, extra: {txt: 'Fin de turno', fn: dlgFinTurno}});
    }
  }
  // si hay un checklist a medio rellenar, no refrescar para no borrarlo
  st.refresh = $('.ck-cuerpo .ck') ? null : () => mOrden(id);
}

/* ═════════ arranque ═════════ */
(async () => {
  if (!CONFIGURADO){
    app(`<div class="login panel"><h1>Falta configurar</h1>
      <p>Abre <strong>config.js</strong> y pega la dirección y la clave de tu proyecto de Supabase. Los pasos están en el README.</p></div>`);
    return;
  }
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return vLogin();
  try { await arrancar(); } catch(e){ toast(e.message, true); vLogin(); }
})();
</script>
